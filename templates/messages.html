{% extends "base.html" %}
{% block title %}留言 · 橘語{% endblock %}
{% block content %}

<div class="message-thread">
  {% for m in messages %}
  <div class="msg-row {{ 'me' if m['sender_id'] == me_id else 'them' }}">
    <div class="msg-bubble-wrap">
      <div class="msg-bubble" id="msg-bubble-{{ m['id'] }}">
        {% if m['image_filename'] %}
        <img src="{{ url_for('static', filename='uploads/' ~ m['image_filename']) }}" class="msg-image">
        {% endif %}
        {% if m['text'] %}<p>{{ m['text'] }}</p>{% endif %}
        <span class="msg-time">{{ m['created_at'][5:16] }}</span>
      </div>

      <form
        id="msg-edit-form-{{ m['id'] }}"
        action="{{ url_for('edit_message', message_id=m['id']) }}"
        method="post"
        class="msg-edit-form"
        style="display:none;"
      >
        <input type="text" name="text" value="{{ m['text'] or '' }}" placeholder="編輯留言文字...">
        <button type="submit"><i class="ti ti-check"></i></button>
      </form>

      <div class="msg-actions">
        <button type="button" class="msg-action-btn" onclick="toggleMsgEdit({{ m['id'] }})">
          <i class="ti ti-pencil"></i> 編輯
        </button>
        <form
          action="{{ url_for('delete_message', message_id=m['id']) }}"
          method="post"
          onsubmit="return confirm('確定要刪除這則留言嗎？');"
        >
          <button type="submit" class="msg-action-btn"><i class="ti ti-trash"></i> 刪除</button>
        </form>
      </div>
    </div>
  </div>
  {% else %}
  <p class="empty-hint">還沒有留言，跟對方說句話吧</p>
  {% endfor %}
</div>

<script>
function toggleMsgEdit(id) {
  const bubble = document.getElementById('msg-bubble-' + id);
  const form = document.getElementById('msg-edit-form-' + id);
  if (form.style.display === 'none') {
    form.style.display = 'flex';
    bubble.style.display = 'none';
  } else {
    form.style.display = 'none';
    bubble.style.display = 'block';
  }
}
</script>

<form action="{{ url_for('messages') }}" method="post" enctype="multipart/form-data" class="message-input-bar">
  <label class="upload-btn">
    <i class="ti ti-photo"></i>
    <input type="file" name="image" accept="image/*" hidden>
  </label>
  <input type="text" name="text" placeholder="留言給對方...">
  <button type="submit"><i class="ti ti-send"></i></button>
</form>

{% endblock %}
