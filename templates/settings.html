{% extends "base.html" %}
{% block title %}設定 · 橘語{% endblock %}
{% block content %}

<p class="page-title">設定</p>

<form action="{{ url_for('settings') }}" method="post" class="settings-form">

  <div class="card">
    <p class="section-label">見面日期</p>
    <input type="date" name="meeting_date" value="{{ meeting_date }}">
  </div>

  <div class="card">
    <p class="section-label">美的資料</p>
    <input type="text" name="name_a" value="{{ user_a['name'] }}" placeholder="名字">
    <input type="text" name="city_a" value="{{ user_a['city'] }}" placeholder="城市">
    <select name="timezone_a">
      {% for tz in timezones %}
      <option value="{{ tz }}" {{ 'selected' if tz == user_a['timezone'] else '' }}>{{ tz }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="card">
    <p class="section-label">Alex 的資料</p>
    <input type="text" name="name_b" value="{{ user_b['name'] }}" placeholder="名字">
    <input type="text" name="city_b" value="{{ user_b['city'] }}" placeholder="城市">
    <select name="timezone_b">
      {% for tz in timezones %}
      <option value="{{ tz }}" {{ 'selected' if tz == user_b['timezone'] else '' }}>{{ tz }}</option>
      {% endfor %}
    </select>
  </div>

  <button type="submit" class="save-btn">儲存設定</button>
</form>

{% endblock %}
