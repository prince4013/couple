{% extends "base.html" %}
{% block title %}見面前準備清單 · 橘語{% endblock %}
{% block content %}

<p class="page-title">見面前準備清單</p>

<p class="section-label">要帶的東西</p>
<div class="checklist-card">
  {% for item in bring_items %}
  <div class="checklist-row">
    <form action="{{ url_for('toggle_checklist', item_id=item['id']) }}" method="post" class="check-form">
      <button type="submit" class="check-btn">
        <i class="ti {{ 'ti-square-rounded-check checked' if item['is_done'] else 'ti-square' }}"></i>
      </button>
    </form>
    <span class="{{ 'done' if item['is_done'] else '' }}">{{ item['text'] }}</span>
    <form action="{{ url_for('delete_checklist_item', item_id=item['id']) }}" method="post" class="delete-form">
      <button type="submit" class="delete-btn"><i class="ti ti-x"></i></button>
    </form>
  </div>
  {% else %}
  <p class="empty-hint">還沒有項目</p>
  {% endfor %}
</div>
<form action="{{ url_for('add_checklist_item') }}" method="post" class="add-item-form">
  <input type="hidden" name="category" value="bring">
  <input type="text" name="text" placeholder="新增要帶的東西">
  <button type="submit"><i class="ti ti-plus"></i></button>
</form>

<p class="section-label" style="margin-top:1.25rem;">想去的地方</p>
<div class="checklist-card">
  {% for item in place_items %}
  <div class="checklist-row">
    <form action="{{ url_for('toggle_checklist', item_id=item['id']) }}" method="post" class="check-form">
      <button type="submit" class="check-btn">
        <i class="ti {{ 'ti-map-pin-check checked' if item['is_done'] else 'ti-map-pin' }}"></i>
      </button>
    </form>
    <span class="{{ 'done' if item['is_done'] else '' }}">{{ item['text'] }}</span>
    <form action="{{ url_for('delete_checklist_item', item_id=item['id']) }}" method="post" class="delete-form">
      <button type="submit" class="delete-btn"><i class="ti ti-x"></i></button>
    </form>
  </div>
  {% else %}
  <p class="empty-hint">還沒有想去的地方</p>
  {% endfor %}
</div>
<form action="{{ url_for('add_checklist_item') }}" method="post" class="add-item-form">
  <input type="hidden" name="category" value="place">
  <input type="text" name="text" placeholder="新增想去的地方">
  <button type="submit"><i class="ti ti-plus"></i></button>
</form>

{% endblock %}
